server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Public market-data REST proxy. Read-only, no API keys, no account actions.
  location /market-api/ {
    proxy_pass https://api.bybit.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.bybit.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_buffering off;
    proxy_request_buffering off;
    add_header Cache-Control "no-store";
  }

  # Hashed Vite assets can be cached aggressively by the browser.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app shell must revalidate so deployments appear immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok";
  }
}
