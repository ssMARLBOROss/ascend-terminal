name: Stable Market Branch Build

on:
  push:
    branches:
      - feature/stable-market-shell-v1-20261008
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
