name: ASCEND Radar TF Alignment
on:
  push:
    branches:
      - feature/radar-4-5-6-tf-alignment-20261018
  pull_request:
    paths:
      - 'apps/terminal/src/market/radarTfAgreement.ts'
      - 'apps/terminal/src/market/useRadarScanner.ts'
      - 'apps/terminal/src/components/RadarView.tsx'
      - 'apps/terminal/tests/radar-tf-agreement.test.mjs'
      - '.github/workflows/radar-tf-alignment.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle pure closed-candle TF engine for tests
        run: ./node_modules/.bin/esbuild apps/terminal/src/market/radarTfAgreement.ts --bundle --platform=node --format=esm --outfile=/tmp/ascend-radar-tf.mjs
      - name: Test 4/5/6 TF agreement, missing data and lookahead
        run: node --test apps/terminal/tests/radar-tf-agreement.test.mjs
      - name: Build actual React terminal
        run: npm run build --workspace @ascend/terminal
