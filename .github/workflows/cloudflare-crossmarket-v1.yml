name: Cloudflare Cross-Market Crypto V1 checks
on:
  push:
    branches: [feature/cloudflare-crossmarket-crypto-v1-20261011]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cross-market-crypto.js
      - run: node --check cross-market-ui.js
      - run: node tests/cloudflare-cross-market.test.mjs
      - run: node tests/cloudflare-structure-evidence.test.mjs
      - run: node tests/cloudflare-vwap.test.mjs
      - run: node tests/cloudflare-liquidity-map.test.mjs
      - run: node tests/cloudflare-workspace-layout.test.mjs
