name: ASCEND Confirmation V2 Browser Integration
on:
  push:
    branches: [feature/confirmation-engine-v2-research-20261011]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - name: Serve Cloudflare HTML locally
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/ascend-browser-http.log 2>&1 &
          sleep 2
      - name: Test seven-stage UI and no false readiness in Chromium
        run: python tests/confirmation_v2_browser_smoke.py
      - name: Collect screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascend-confirmation-v2-screenshots
          path: ui-smoke-results/*.png
          if-no-files-found: ignore
          retention-days: 2
