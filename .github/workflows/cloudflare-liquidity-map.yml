name: Cloudflare Liquidity Map V1 checks
on:
  push:
    branches: [feature/cloudflare-liquidity-map-clean-20261011]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check liquidity-map.js
      - run: node tests/cloudflare-liquidity-map.test.mjs
