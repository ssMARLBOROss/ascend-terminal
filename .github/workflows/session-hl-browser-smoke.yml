name: ASCEND Browser Visual Smoke · Session H/L
on:
  push:
    branches: [test/session-hl-browser-visibility-20261011]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - name: Start local terminal HTML
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/ascend-ui-http.log 2>&1 &
          echo $! > /tmp/ascend-ui-server.pid
          sleep 2
      - name: Check live delivery and browser DOM
        run: python tests/session_hl_visual_smoke.py
      - name: Attach visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascend-session-hl-visual-smoke
          path: ui-smoke-results/*.png
          if-no-files-found: ignore
          retention-days: 1
