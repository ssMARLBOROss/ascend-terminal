name: Import Cloudflare Market - Verify Stable Terminal
on:
  push:
    branches:
      - feature/import-cloudflare-market-20261014
  pull_request:
    branches:
      - feature/stable-market-shell-v1-20261008
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
