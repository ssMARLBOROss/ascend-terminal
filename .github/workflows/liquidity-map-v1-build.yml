name: Liquidity Map V1 Research Build
on:
  push:
    branches:
      - feature/liquidity-map-chart-v1-20261011
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
