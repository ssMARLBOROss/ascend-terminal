name: ASCEND Live MEXC 1m 5m 15m Audit
on:
  push:
    branches: [audit/live-mexc-data-quality-20261011]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production OHLCV, age and completeness, no secrets
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json, time, math
          origin="https://ascend-terminal-api-production.up.railway.app"
          now=time.time()
          sets=[("1m",60,260),("5m",300,320),("15m",900,260)]
          complete={}
          for tf,step,limit in sets:
            url=f"{origin}/api/v2/klines?symbol=BTC_USDT&timeframe={tf}&limit={limit}"
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"ASCEND-Live-Audit/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=16) as res:
                obj=json.load(res)
                code=res.status
              rows=obj.get("candles",[])
              times=[int(x["time"]) for x in rows]
              bars=[x for x in rows if int(x["time"])+step<=now]
              t=[int(x["time"]) for x in bars]
              gaps=sum(t[i]-t[i-1]!=step for i in range(1,len(t)))
              last=max(t)+step if t else 0
              delta=int(now-last) if last else None
              complete[tf]=bars
              print("MEXC",tf,"HTTP",code,"total",len(rows),"closed",len(bars),
                    "latest_close_age_s",delta,"gaps",gaps,
                    "raw_last_is_open",bool(times and times[-1]+step>now),
                    "symbol",obj.get("symbol"),flush=True)
            except Exception as e:
              print("MEXC",tf,"FAIL",type(e).__name__,str(e)[:180],flush=True)
          for tf,source,step,outstep in [
             ("10m","5m",300,600),("30m","15m",900,1800)]:
            bins={}
            for b in complete.get(source,[]):
              t=int(b["time"]);group=(t//outstep)*outstep
              bins.setdefault(group,[]).append(t)
            n=sum(len(g)==outstep//step and all(t==group+i*step for i,t in enumerate(sorted(g)))
              for group,g in bins.items() if group+outstep<=now)
            print("COMPUTED",tf,"source",source,"complete_aligned_groups",n,flush=True)
          assert complete.get("1m") and complete.get("5m") and complete.get("15m"),"Critical real OHLCV unavailable"
          PY
