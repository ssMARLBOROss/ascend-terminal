name: ASCEND Macro FRED Live Provider Smoke
on:
  push:
    branches: [research/macro-provider-live-smoke-20261011]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production macro JSON without cookies or secrets
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen,Request
          url="https://ascend-terminal-api-production.up.railway.app/api/v2/macro/daily"
          response=urlopen(Request(url,headers={"Accept":"application/json",
            "User-Agent":"ASCEND-Research-GitHub-CI/1.0"}),timeout=45)
          data=json.load(response)
          markets=data.get("markets",{})
          print("HTTP",response.status,"SUMMARY",data.get("status"),
            "AVAILABLE",data.get("available"),"TOTAL",data.get("total"))
          for sym in ["SP500","NASDAQCOM","DGS10","DGS2","DTWEXBGS","DCOILWTICO","DXY","XAUUSD","GOLD_GC"]:
            row=markets.get(sym,{})
            print(sym,row.get("status"),row.get("observation_date"),
              "source",row.get("source"),"reason",row.get("reason","-"))
          assert response.status==200
          assert all(sym in markets for sym in ("SP500","NASDAQCOM","DGS10","DGS2","DTWEXBGS","DCOILWTICO","DXY","XAUUSD"))
          assert "DXY" in markets and markets["DXY"].get("source")
          assert markets["XAUUSD"]["status"]=="NO_DATA"
          PY
      - name: Test upstream FRED and DBnomics mirror from GitHub runner
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          for title,url in [
            ("FRED", "https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500&cosd=2026-10-01"),
            ("DBNOMICS", "https://api.db.nomics.world/v22/series/FRED/SP500?observations=1"),
            ("YAHOO", "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=5d&interval=1d"),
          ]:
            try:
              with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0",
                 "Accept":"application/json,text/csv"}),timeout=12) as res:
                snippet=res.read(350)
                print(title,"HTTP",res.status,"length",len(snippet),
                  "mime",res.headers.get("Content-Type"),"preview",repr(snippet[:90]))
            except Exception as e: print(title,"FAILED",type(e).__name__,str(e)[:130])
          PY
      - name: Check Yahoo research index gold oil and dollar symbol coverage
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,time,datetime
          for name in ['^GSPC','^IXIC','DX-Y.NYB','GC=F','CL=F','^TNX','^FVX']:
            url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(name,safe='')+'?range=10d&interval=1d'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=9) as r:
                d=json.load(r)['chart']['result'][0]
              quote=d['indicators']['quote'][0]['close']
              pair=[(t,v) for t,v in zip(d.get('timestamp') or [],quote) if v is not None]
              print(name,'VALID',len(pair),'DATE',datetime.datetime.fromtimestamp(pair[-1][0],datetime.UTC).strftime('%Y-%m-%d'),'CLOSE',round(pair[-1][1],4))
            except Exception as e: print(name,'FAILED',type(e).__name__,str(e)[:120])
            time.sleep(.4)
          PY
