name: ASCEND Session High Low V1 validation
on:
  push:
    branches: [feature/session-high-low-layer-v1-20261011]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check session-high-low.js
      - run: node tests/cloudflare-session-high-low.test.mjs
      - run: node tests/cloudflare-choch-10m.test.mjs
      - run: node tests/cloudflare-structure-evidence.test.mjs
      - run: node tests/cloudflare-vwap.test.mjs
      - run: node tests/cloudflare-liquidity-map.test.mjs
      - run: node tests/cloudflare-workspace-layout.test.mjs
      - run: node tests/cloudflare-cross-market.test.mjs
      - run: node tests/cloudflare-macro-fred-replay.test.mjs
